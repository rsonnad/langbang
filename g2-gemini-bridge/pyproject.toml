[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langbangtrans"
version = "0.1.0"
description = "Direct BLE Even G2 to Gemini Live translation bridge for LangBangTrans"
requires-python = ">=3.11"
dependencies = [
  "bleak>=0.22.3",
  "sounddevice>=0.4.7",
  "websockets>=12.0",
]

[project.scripts]
langbangtrans = "langbangtrans.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

